# Overview:
# - Purpose: Central configuration for Python tooling.
# - Used by: pytest, black, ruff, mypy, and packaging tools.
# - Adds: Consistent behavior across local development and CI.
# - Learn more: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "milk_component_calculations"
version = "0.1.0"
description = "Merge milk-component and milk-yield records and calculate fat, protein, and lactose yields"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas", "matplotlib", "numpy", "openpyxl"]

[tool.setuptools.packages.find]
include = ["milk_component_calculations*"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["milk_component_calculations/tests"]
