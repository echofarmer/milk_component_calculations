# Overview:
# - Purpose: Run the lint, the tests, and the example workflow on every push/PR.
# - Used by: GitHub Actions.
# - Adds: Early warning when something fails on a clean machine.
# - Learn more: https://docs.github.com/actions/quickstart
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: milk_component_calculations
          environment-file: environment.yml
          auto-activate-base: false

      - name: Run required beginner checks
        shell: bash -l {0}
        run: |
          make lint
          make test
          # Run the full workflow on the example data, as a user would
          make run
          # Optional checks for advanced students.
          # Uncomment these lines when your class is ready.
          # make type
          # make doclint
          # make audit
          # make secrets
